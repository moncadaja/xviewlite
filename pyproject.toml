[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "xviewlite"
dynamic = ["version", "dependencies"]
description = "ISS XAFS desktop analysis tools"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"

[project.scripts]
xviewlite = "xviewlite.launch:main"

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["xviewlite*"]
exclude = ["xviewlite.tests*"]

[tool.setuptools_scm]
fallback_version = "0+unknown"

[tool.pytest.ini_options]
testpaths = ["xviewlite/tests"]
qt_api = "pyqt5"

[tool.black]
line-length = 115
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist

  # The following are specific to Black, you probably don't want those.
  | blib2to3
  | tests/data
)/
'''
