[workspace]
channels = ["conda-forge"]
name = "pixi_xview"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = { cmd = "python -m pytest", env = { QT_QPA_PLATFORM = "offscreen" } }
smoke = { cmd = "xviewlite --smoke-test", env = { QT_QPA_PLATFORM = "offscreen" } }
# Run this only once pixi run bash -c "export IPYTHONDIR=\$PIXI_PROJECT_ROOT/.ipython && ipython profile create default"
start = "unset PYTHONPATH && export IPYTHONDIR=$PIXI_PROJECT_ROOT/.ipython && ipython --profile=default -i launch_xview_gui.py"

[dependencies]
python = ">=3.12,<3.15"
databroker = ">=2.0.1,<3"
pyqt = ">=5.15.11,<6"
setuptools = ">=84.0.0,<85"
mp-api = ">=0.46.5,<0.47"
xraylarch = ">=2026.3.1,<2027"
slack-sdk = ">=3.33,<4"
dropbox = ">=12.2.2,<13"
opencv = ">=5.0.0,<6"
tiled = ">=0.2.9,<0.3"
pandas = ">=3.0.6,<4"
matplotlib = ">=3.11.2,<4"
larixite = ">=2026.1.0,<2027"
numpy = ">=2.5.3,<3"
# Required by wxutils and Larch but omitted from their Conda dependencies.
jeepney = ">=0.9.0,<0.10"
mkl_fft = ">=2.3.2,<3"


[pypi-dependencies]
xviewlite = { path = ".", editable = true, extras = ["test"] }
xview = { path = "../xview", editable = true }
xas = { path = "../issxas", editable = true }
issfactortools = { path = "../issfactortools", editable = true }
isscloudtools = { path = "../isscloudtools", editable = true }
isstools = { path = "../isstools", editable = true }

pymcr = ">=0.5.1, <0.6"
bluesky-widgets = ">=0.0.18, <0.0.19"
# Required by Larch's Sitka reader.
sitka-spruce = ">=0.3, <0.4"

[activation]
scripts = ["setup-runtime.sh"]
